name: build

# Rebuilds the four Mantella SKSE plugin DLLs for Skyrim AE 1.7.104 and ships
# them as a FOMOD override of the base Mantella mod (Nexus 98631).
#
# Follows the mod-porting CI pattern proven in HeapSentinel / SexLabPPrism-re:
#   * CommonLibSSE-NG pinned to a revision whose include/REL/IDDB.h declares
#     Format::SSEv5 (the 1.7.104 Address Library reader) — asserted BEFORE the
#     build, so a green run cannot come from the wrong reader;
#   * the upstream plugin sources pinned by commit;
#   * verification gates that can fail (tools/verify-dll.py parses the
#     SKSEPlugin_Version export and the V5 reader strings);
#   * packaging, verification and release delegated to the shared modforge
#     pipeline (aviallon-mods/modforge): the zip is assembled from
#     fomod-package.toml's explicit file list (+ meta.ini stamped at the root),
#     gated by the mutation-tested verify_fomod.py and attached to the tag's
#     release.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  # Pinned upstream sources (the four Mantella SKSE plugins).
  SKSE_HTTP_SHA: 8da249b677b9543ffb4284f9ad0a300d72f69d58
  MANTELLA_DIALOGUE_SHA: 4c5d9c5250382dc7ed80430965b0c313fd1d7b8b
  MANTELLA_LAUNCHER_SHA: a7fdb92eeb94403f59d6264f043217bc1c55c090
  MANTELLA_SUBTITLES_SHA: 053a81474334423186e469672373b8e7dafb5676
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Assert the CommonLibSSE-NG pin can read Address Library V5
        shell: bash
        run: |
          set -euo pipefail
          # Single source of truth: the REF our overlay port builds.
          sha=$(grep -oP '^\s+REF \K[0-9a-f]{40}' ports/commonlibsse-ng/portfile.cmake)
          [ -n "$sha" ] || { echo "::error::could not read the CommonLibSSE-NG REF from ports/commonlibsse-ng/portfile.cmake"; exit 1; }
          echo "CommonLibSSE-NG pin: $sha"
          mkdir -p .clng-check && cd .clng-check
          git init -q . && git remote add origin https://github.com/alandtse/CommonLibVR.git
          git fetch -q --depth 1 origin "$sha" && git checkout -q FETCH_HEAD
          test -f include/REL/IDDB.h || { echo "::error::IDDB.h missing - wrong revision"; exit 1; }
          grep -q "SSEv5" include/REL/IDDB.h || { echo "::error::no SSEv5 in IDDB.h - this pin cannot read the 1.7.104 versionlib bins"; exit 1; }
          echo "format-5 Address Library reader present in the pinned revision"

      - name: Fetch pinned plugin sources
        shell: bash
        run: |
          set -euo pipefail
          fetch() { git init -q "$2" && git -C "$2" remote add origin "$1" \
            && git -C "$2" fetch -q --depth 1 origin "$3" && git -C "$2" checkout -q FETCH_HEAD; }
          fetch https://github.com/Leidtier/SKSE_HTTP                     _deps/SKSE_HTTP                     "$SKSE_HTTP_SHA"
          fetch https://github.com/mikastamm/mantella-vanilla-dialogue     _deps/mantella-vanilla-dialogue     "$MANTELLA_DIALOGUE_SHA"
          fetch https://github.com/art-from-the-machine/Mantella-SKSE-Launcher _deps/Mantella-SKSE-Launcher    "$MANTELLA_LAUNCHER_SHA"
          fetch https://github.com/swwu/Mantella-Subtitles-Plugin-NG       _deps/Mantella-Subtitles-Plugin-NG  "$MANTELLA_SUBTITLES_SHA"

      - name: Apply source fixups
        shell: bash
        run: |
          set -euo pipefail
          # `git -C` does not touch $PWD, and empty globs (a plugin with no
          # patch) must be skipped, not passed to `git apply` literally.
          apply() { for p in patches/$1-*.patch; do [ -e "$p" ] || continue; git -C "_deps/$1" apply "$PWD/$p"; done; }
          apply SKSE_HTTP
          apply mantella-vanilla-dialogue
          apply Mantella-SKSE-Launcher
          apply Mantella-Subtitles-Plugin-NG
          # The upstream repos pin a vcpkg registry frozen in 2022
          # (CommonLibSSE-NG 3.6/3.7: no V5 reader). commonlibsse-ng comes from
          # our overlay port instead; the rest resolves at a recent baseline.
          for m in SKSE_HTTP mantella-vanilla-dialogue Mantella-SKSE-Launcher Mantella-Subtitles-Plugin-NG; do
            printf '%s\n' '{"default-registry":{"kind":"git","repository":"https://github.com/microsoft/vcpkg.git","baseline":"07f4812200df3d3c931c0c8a6081d3b21fe2bf9f"}}' > "_deps/$m/vcpkg-configuration.json"
          done

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build the four plugins (MSVC, vcpkg overlay port = CommonLibSSE-NG 6.8.0)
        shell: bash
        # Git Bash rewrites arguments that look like POSIX paths, so ALL flags
        # use the dash syntax (cl.exe accepts -D/-EHsc/-GR/-W3): a leading /D
        # becomes 'C:/Program Files/Git/DUNICODE'. Real paths ($PWD/ports) must
        # KEEP the MSYS conversion, so no blanket MSYS2_ARG_CONV_EXCL here — an
        # earlier version of this step set it and vcpkg then refused
        # 'D:/d/a/.../ports' as a missing overlay directory.
        # Overriding CMAKE_CXX_FLAGS also wipes CMake's MSVC defaults
        # (/EHsc /GR /W3): re-add them (in dash form) or cl warns C4530 and
        # ships without unwind semantics.
        # NB: the runner carries VS 18 (2026), so the VS *generator* is a trap —
        # msvc-dev-cmd + Ninja above sidesteps it.
        run: |
          set -euo pipefail
          # vcpkg refuses VCPKG_DEFAULT_BINARY_CACHE pointing at a directory
          # that does not exist yet (a cold cache restores nothing).
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          build_one() {
            local m=$1 out=$2
            cmake -S "_deps/$m" -B "build/$m" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x64-windows-static-md \
              "-DVCPKG_OVERLAY_PORTS=$PWD/ports" \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              "-DCMAKE_CXX_FLAGS=-DWIN32 -D_WINDOWS -DUNICODE -D_UNICODE -DNOMINMAX -D_CRT_SECURE_NO_WARNINGS -EHsc -GR -W3"
            cmake --build "build/$m"
            mkdir -p out
            cp "build/$m/$out" "out/$out"
          }
          build_one SKSE_HTTP                     SKSE_HTTP.dll
          build_one mantella-vanilla-dialogue     MantellaDialogue.dll
          build_one Mantella-SKSE-Launcher        MantellaLauncher.dll
          build_one Mantella-Subtitles-Plugin-NG  MantellaSubtitles.dll

      - name: Verify the PEs (exports, SKSEPlugin_Version, V5 reader)
        shell: bash
        run: python tools/verify-dll.py out/*.dll

      # Packaging, verification and release are DELEGATED to the shared
      # modforge pipeline (the `package` job below): it assembles the zip from
      # fomod-package.toml's explicit file list and gates it with the
      # mutation-tested verify_fomod.py. The four DLLs in out/ are therefore
      # just handed over through a per-run actions/cache staging entry, which
      # `package` restores with the same key. (The shared workflow's own
      # download_run_id input cannot carry them yet: its job token is scoped to
      # contents:write while the artifact download API needs actions:read.)
      # The handoff is same-OS on purpose (package runs on windows-latest too):
      # cache entries do not transfer between Windows and Linux runners.
      - name: Hand the built DLLs to the packaging job (per-run cache)
        uses: actions/cache@v4
        with:
          path: out
          key: mantella-pkg-stage-${{ github.run_id }}

  # ===========================================================================
  # PACKAGING / VERIFICATION / RELEASE - delegated to the shared modforge
  # pipeline (aviallon-mods/modforge).
  # ===========================================================================
  # The FOMOD override zip (Mantella-AE1.7.104-SKSE-Plugins-fixed.zip - name
  # preserved) is assembled from fomod-package.toml's EXPLICIT file list with
  # meta.ini stamped at the zip root - every FOMOD source= is a regular file by
  # construction, the defect that shipped as "Copied 0 item(s)" in Amethyst -
  # and only ships when verify_fomod.py passes: exact entry list, a
  # ModuleConfig.xml that resolves to >= 1 <plugin>, payload byte-identity with
  # the build inputs, complete meta.ini. A pushed tag v* attaches the verified
  # zip to that tag's release.
  package:
    name: package + verify + release (modforge)
    needs: build
    permissions:
      contents: write
    uses: aviallon-mods/modforge/.github/workflows/build-fomod.yml@main
    with:
      mod_name: Mantella-SKSE-Plugins
      package_specs: fomod-package.toml
      submodules: false
      runs_on: windows-latest
      cache_paths: out
      cache_key: mantella-pkg-stage-${{ github.run_id }}
      extra_artifact: out/*.dll